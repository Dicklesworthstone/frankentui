[package]
name = "ftui"
version = "0.4.1"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "FrankenTUI public facade and prelude."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "ftui", "frankentui"]
categories = ["command-line-interface", "gui"]

[features]
default = ["runtime", "extras"]
runtime = ["dep:ftui-runtime"]
extras = ["dep:ftui-extras"]
crossterm = ["runtime", "ftui-core/crossterm", "ftui-runtime/crossterm-compat"]

[dependencies]
ftui-core = { path = "../ftui-core", version = "0.4.1" }
ftui-render = { path = "../ftui-render", version = "0.4.1" }
ftui-style = { path = "../ftui-style", version = "0.4.1" }
ftui-text = { path = "../ftui-text", version = "0.4.1" }
ftui-layout = { path = "../ftui-layout", version = "0.4.1" }
ftui-runtime = { path = "../ftui-runtime", version = "0.4.1", optional = true }
ftui-widgets = { path = "../ftui-widgets", version = "0.4.1" }
ftui-extras = { path = "../ftui-extras", version = "0.4.1", optional = true }
