[package]
name = "ftui"
version = "0.9.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "FrankenTUI public facade and prelude."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "ftui", "frankentui"]
categories = ["command-line-interface", "gui"]

[features]
# A default build can open a terminal: the native ftui-tty backend on Unix and
# the Crossterm backend elsewhere (`ftui::App::run` picks whichever was
# compiled; see `ftui::runtime::DEFAULT_BACKEND`). Disable `backend` for
# headless, WASM, or custom-backend builds.
default = ["runtime", "extras", "backend", "bidi"]
# Compiles internal research modules not reachable from the public API. Not supported. See README.
experimental = []
runtime = ["dep:ftui-runtime"]
extras = ["dep:ftui-extras"]
backend = ["native-backend", "crossterm"]
native-backend = ["runtime", "ftui-runtime/native-backend"]
crossterm = ["runtime", "ftui-core/crossterm", "ftui-runtime/crossterm-compat"]
bidi = ["ftui-widgets/bidi"]
# Load/save keymaps (`ftui::prelude::KeyMap`) as TOML/JSON files.
serde = ["ftui-core/serde"]
# Portable-SIMD kernels for the printable-ASCII width fast path. Not default:
# it needs a nightly with `portable_simd`, and the scalar path is correct and
# already fast enough for short runs.
simd = ["ftui-core/simd"]

[lints]
workspace = true

[dependencies]
ftui-a11y = { path = "../ftui-a11y", version = "0.9.0" }
ftui-core = { path = "../ftui-core", version = "0.9.0" }
ftui-render = { path = "../ftui-render", version = "0.9.0" }
ftui-style = { path = "../ftui-style", version = "0.9.0" }
ftui-text = { path = "../ftui-text", version = "0.9.0" }
ftui-layout = { path = "../ftui-layout", version = "0.9.0" }
ftui-runtime = { path = "../ftui-runtime", version = "0.9.0", optional = true }
ftui-widgets = { path = "../ftui-widgets", version = "0.9.0" }
ftui-extras = { path = "../ftui-extras", version = "0.9.0", optional = true }

[[example]]
name = "agent_shell"
required-features = []

# Only so the README's harness fences (ShadowRun, RolloutScorecard, TimeTravel)
# can be compiled and checked against README.md in tests/readme_snippets.rs.
# ftui does not depend on the harness at build time.
[dev-dependencies]
ftui-harness = { path = "../ftui-harness", version = "0.9.0" }
