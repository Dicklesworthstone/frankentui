[package]
name = "ftui-a11y"
version = "0.6.1"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Accessibility layer for FrankenTUI"
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui-a11y"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "accessibility", "a11y"]
categories = ["command-line-interface", "gui", "accessibility"]

[features]
default = []
# Compiles internal research modules not reachable from the public API. Not supported. See README.
experimental = []

[lints]
workspace = true

[dependencies]
ftui-core = { path = "../ftui-core", version = "0.6.1" }
ahash = "0.8"

[dev-dependencies]
