[package]
name = "ftui-style"
version = "0.6.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Style, theme, and color primitives for FrankenTUI."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui-style"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "ftui", "frankentui"]
categories = ["command-line-interface", "gui"]

[dependencies]
ahash = "0.8"
arc-swap = "1.9.2"
ftui-render = { path = "../ftui-render", version = "0.6.0" }
tracing = "0.1.41"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
ftui-core = { path = "../ftui-core", version = "0.6.0" }
tracing-test = "0.2.5"
proptest = "1.7.0"
serde_json = "1.0.151"
