[package]
name = "doctor_frankentui"
version = "0.6.0"
edition = "2024"
publish = false
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Integrated TUI capture, seeding, suite reporting, and diagnostics for FrankenTUI agent workflows."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/doctor_frankentui"
readme = "../../README.md"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
wait-timeout = "0.2.1"
pathdiff = "0.2.3"
v_htmlescape = "0.17.0"
which = "8.0.5"
fastapi-output = { version = "0.3.0", default-features = false }
sqlmodel-console = "0.3.0"
sha2 = "0.11.0"
regex-lite = "0.1.6"
ftui-runtime = { path = "../ftui-runtime", version = "0.6.0", default-features = false }
ftui-harness = { path = "../ftui-harness", version = "0.6.0" }

[dev-dependencies]
proptest = "1.7.0"
tempfile = "3.19.1"
