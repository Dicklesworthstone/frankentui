[package]
name = "ftui-showcase-wasm"
version = "0.4.0"
edition = "2024"
publish = false
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "WASM showcase runner for FrankenTUI demo app."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ftui-web = { path = "../ftui-web", version = "0.4.0", features = ["input-parser"] }
ftui-demo-showcase = { path = "../ftui-demo-showcase", version = "0.4.0", default-features = false }
ftui-layout = { path = "../ftui-layout", version = "0.4.0" }
serde_json = "1.0.150"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.100"
wasm-bindgen = "0.2.123"
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[package.metadata.wasm-pack.profile.release]
# Keep size optimization but avoid long-running converge passes.
wasm-opt = ["-Oz"]
