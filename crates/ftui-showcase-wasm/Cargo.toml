[package]
name = "ftui-showcase-wasm"
version = "0.8.0"
edition = "2024"
publish = false
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "WASM showcase runner for FrankenTUI demo app."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Compiles internal research modules not reachable from the public API. Not supported. See README.
experimental = []

[lints]
workspace = true

[dependencies]
ftui-core = { path = "../ftui-core", version = "0.8.0" }
ftui-web = { path = "../ftui-web", version = "0.8.0", features = ["input-parser"] }
# default-features = false drops only the two native terminal backends
# (native-backend, crossterm-compat), which cannot mean anything in a browser.
# Every other default feature is opted back in, so the browser showcase has the
# same screens and capabilities as `cargo run -p ftui-demo-showcase`:
#   screen-mermaid -> ftui-extras/markdown-diagram (mermaid_showcase,
#                     mermaid_mega_showcase) - the two screens the web build
#                     used to be missing entirely.
#   clipboard/image/logging -> previously dropped for wasm binary size, not
#                     because they fail to build. Parity is worth the bytes.
ftui-demo-showcase = { path = "../ftui-demo-showcase", version = "0.8.0", default-features = false, features = [
  "caps-probe",
  "clipboard",
  "image",
  "logging",
  "screen-mermaid",
] }
ftui-layout = { path = "../ftui-layout", version = "0.8.0" }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[package.metadata.wasm-pack.profile.release]
# Keep size optimization but avoid long-running converge passes.
wasm-opt = ["-Oz"]
