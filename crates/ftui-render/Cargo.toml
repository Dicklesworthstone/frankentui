[package]
name = "ftui-render"
version = "0.6.1"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Render kernel: cells, buffers, diffs, and ANSI presentation."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui-render"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "ftui", "frankentui"]
categories = ["command-line-interface", "gui"]

[features]
default = []
# Compiles internal research modules not reachable from the public API. Not supported. See README.
experimental = []
# Enable performance tracing spans
tracing = ["ftui-core/tracing", "dep:tracing"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"] }

[dependencies]
ahash = "0.8"
bitflags = "2.13.1"
memchr = "2.8.3"
smallvec = "1.15.1"
unicode-segmentation = "1.13.3"
web-time = "1.1.0"
bumpalo = { version = "3.20.3", features = ["collections"] }
ftui-core = { path = "../ftui-core", version = "0.6.1" }
# The frame collects accessibility nodes into an ftui-a11y tree builder
# (ftui-a11y depends only on ftui-core, so this introduces no cycle).
ftui-a11y = { path = "../ftui-a11y", version = "0.6.1" }
tracing = { version = "0.1.41", optional = true }
# Note: ftui-render is the core kernel and should not depend on ftui-style.
# ftui-style depends on ftui-render (not vice versa). Allowed workspace
# dependencies here: ftui-core, ftui-a11y.
# ftui-layout = { path = "../ftui-layout" }  # TODO: Add when needed
# ftui-text = { path = "../ftui-text" }      # TODO: Add when needed

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
ftui-core = { path = "../ftui-core", version = "0.6.1" }
proptest = "1.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bench]]
name = "cell_bench"
harness = false

[[bench]]
name = "buffer_bench"
harness = false

[[bench]]
name = "diff_bench"
harness = false

[[bench]]
name = "presenter_bench"
harness = false

[[bench]]
name = "double_buffer_bench"
harness = false

[[bench]]
name = "resize_storm_bench"
harness = false

[[bench]]
name = "arena_bench"
harness = false

[[bench]]
name = "roaring_bench"
harness = false
required-features = ["experimental"]
