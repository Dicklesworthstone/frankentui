[package]
name = "ftui-web"
version = "0.6.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "WASM backend implementation for FrankenTUI (host-driven, deterministic)."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui-web"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "ftui", "frankentui"]
categories = ["command-line-interface", "gui"]

[features]
default = []
# Enable JSON input parser for converting frankenterm-web encoded inputs to Events.
input-parser = ["dep:serde", "dep:serde_json"]
# Enable schema compatibility tracing spans/logs in session trace parsing.
tracing = ["dep:tracing"]

[dependencies]
ftui-backend = { path = "../ftui-backend", version = "0.6.0" }
ftui-core = { path = "../ftui-core", version = "0.6.0" }
ftui-layout = { path = "../ftui-layout", version = "0.6.0" }
ftui-render = { path = "../ftui-render", version = "0.6.0" }
ftui-runtime = { path = "../ftui-runtime", version = "0.6.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
tracing = { version = "0.1.41", optional = true }

[dev-dependencies]
# Host-agnostic accessibility preferences + screen-reader pipeline, exercised by
# the cross-browser a11y/IME E2E matrix (bd-2vr05.7.5). Dev-only: ftui-a11y does
# not depend on ftui-web, so this stays acyclic.
ftui-a11y = { path = "../ftui-a11y", version = "0.6.0" }
# Used only for small deterministic unit tests.
criterion = { version = "0.8.2", features = ["html_reports"] }
pretty_assertions = "1.4.1"
# JSONL evidence validation in SDK adapter/contract tests (bd-2vr05.9.3/.9.6).
serde_json = "1.0.151"
tracing-subscriber = { version = "0.3.20", features = ["registry"] }
wasm-bindgen-test = "0.3.76"

[[bench]]
name = "pane_pointer_bench"
harness = false
