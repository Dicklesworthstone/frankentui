[package]
name = "ftui-simd"
version = "0.8.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Safe portable-SIMD row comparison and ASCII detection kernels for FrankenTUI."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui-simd"
readme = "../../README.md"
keywords = ["simd", "terminal", "ftui", "frankentui", "ascii"]
categories = ["command-line-interface", "gui"]

[features]
default = []
# Compiles internal research modules not reachable from the public API. Not supported. See README.
experimental = []

[lints]
workspace = true

[dependencies]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "simd_bench"
harness = false
