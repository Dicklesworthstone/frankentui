[package]
name = "ftui-pty"
version = "0.6.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "PTY-backed test utilities for FrankenTUI."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui-pty"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "ftui", "frankentui"]
categories = ["command-line-interface", "gui"]

[dependencies]
frankenterm-core = { version = "0.2.0", features = ["ws-codec"] }
ftui-core = { path = "../ftui-core", version = "0.6.0", features = ["crossterm"] }
portable-pty = "0.9.0"
serde_json = "1.0.151"
time = { version = "0.3.54", features = ["formatting"] }
tungstenite = "0.30.0"
unicode-width = "0.2"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
