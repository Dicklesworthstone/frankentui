[package]
name = "ftui-harness"
version = "0.6.1"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Test harness and reference fixtures for FrankenTUI."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui-harness"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "ftui", "frankentui"]
categories = ["command-line-interface", "gui"]

[features]
default = []
# Compiles internal research modules not reachable from the public API. Not supported. See README.
experimental = []
pty-capture = ["dep:portable-pty", "ftui-extras/pty-capture"]
telemetry = ["ftui-runtime/telemetry"]

[lints]
workspace = true

[dependencies]
ftui-render = { path = "../ftui-render", version = "0.6.1", features = ["tracing"] }
ftui-core = { path = "../ftui-core", version = "0.6.1", features = ["crossterm"] }
ftui-runtime = { path = "../ftui-runtime", version = "0.6.1", features = ["crossterm-compat"] }
ftui-widgets = { path = "../ftui-widgets", version = "0.6.1" }
ftui-style = { path = "../ftui-style", version = "0.6.1" }
ftui-text = { path = "../ftui-text", version = "0.6.1", features = ["markup"] }
ftui-layout = { path = "../ftui-layout", version = "0.6.1" }
ftui-extras = { path = "../ftui-extras", version = "0.6.1", features = ["theme"] }
portable-pty = { version = "0.9.0", optional = true }
serde_json = "1.0.151"
blake3 = "1.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["registry"] }
proptest = "1.7.0"

[dev-dependencies]
ftui-a11y = { path = "../ftui-a11y", version = "0.6.1" }
ftui-pty = { path = "../ftui-pty", version = "0.6.1" }
portable-pty = "0.9.0"
ratatui = "0.30.2"
