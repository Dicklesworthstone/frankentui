[package]
name = "ftui-harness"
version = "0.9.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Test harness and reference fixtures for FrankenTUI."
repository = "https://github.com/Dicklesworthstone/frankentui"
homepage = "https://github.com/Dicklesworthstone/frankentui"
documentation = "https://docs.rs/ftui-harness"
readme = "../../README.md"
keywords = ["tui", "terminal", "ui", "ftui", "frankentui"]
categories = ["command-line-interface", "gui"]

[features]
default = ["native-backend"]
# Compiles internal research modules not reachable from the public API. Not supported. See README.
experimental = []
pty-capture = ["dep:portable-pty", "ftui-extras/pty-capture"]
telemetry = ["ftui-runtime/telemetry"]
native-backend = ["ftui-runtime/native-backend"]

[lints]
workspace = true

[dependencies]
ftui-render = { path = "../ftui-render", version = "0.9.0", features = ["tracing"] }
ftui-core = { path = "../ftui-core", version = "0.9.0" }
ftui-runtime = { path = "../ftui-runtime", version = "0.9.0" }
ftui-widgets = { path = "../ftui-widgets", version = "0.9.0" }
ftui-style = { path = "../ftui-style", version = "0.9.0" }
ftui-text = { path = "../ftui-text", version = "0.9.0", features = ["markup"] }
ftui-layout = { path = "../ftui-layout", version = "0.9.0" }
ftui-extras = { path = "../ftui-extras", version = "0.9.0", features = ["theme"] }
portable-pty = { version = "0.9.0", optional = true }
serde_json = "1.0.151"
blake3 = "1.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["registry"] }

# Not for wasm32. proptest's default features include `fork`, which pulls
# rusty-fork -> wait-timeout, and wait-timeout has no wasm32 implementation:
# its `imp` module is cfg'd for unix and windows only, so the target fails to
# build with "cannot find module or crate `imp`". ftui-harness is a normal
# dependency of ftui-demo-showcase, which ftui-showcase-wasm builds, so that
# error reaches the browser demo. Property-test strategies mean nothing in a
# wasm bundle, so the dependency and the module it feeds are simply absent
# there; native builds are unaffected, features and all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proptest = "1.7.0"
# `crossterm` / `crossterm-compat` move here for the same reason. ftui-core
# excludes its real `terminal_session` on wasm32 whatever the feature says, and
# leaves a stub exposing only `terminal_output_lock`, while ftui-runtime gates
# its `SessionOptions`/`TerminalSession` import on `crossterm-compat` alone.
# Enabling that feature from here turned the mismatch into a build error the
# moment ftui-demo-showcase started depending on this crate at runtime, even
# though ftui-showcase-wasm deliberately avoids both features itself.
ftui-core = { path = "../ftui-core", version = "0.9.0", features = ["crossterm"] }
ftui-runtime = { path = "../ftui-runtime", version = "0.9.0", features = ["crossterm-compat"] }

[dev-dependencies]
# Path-only, deliberately without a `version`: `ftui` depends on `ftui-harness`,
# so `ftui-harness` must publish first and `ftui` at the new version does not yet
# exist on the registry at that point. Cargo strips a path-only dev-dependency
# when packaging, which breaks the cycle. Same pattern as `ftui-layout` and
# `ftui-runtime` use for their dev-dependency on `ftui-harness`.
ftui = { path = "../ftui", default-features = false, features = ["runtime"] }
ftui-a11y = { path = "../ftui-a11y", version = "0.9.0" }
ftui-pty = { path = "../ftui-pty", version = "0.9.0" }
portable-pty = "0.9.0"
ratatui = "0.30.2"
