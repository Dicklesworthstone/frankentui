[workspace]
resolver = "2"
members = [
    "crates/doctor_frankentui",
    "crates/ftui",
    "crates/ftui-a11y",
    "crates/ftui-backend",
    "crates/ftui-core",
    "crates/ftui-demo-showcase",
    "crates/ftui-extras",
    "crates/ftui-harness",
    "crates/ftui-i18n",
    "crates/ftui-layout",
    "crates/ftui-pty",
    "crates/ftui-render",
    "crates/ftui-runtime",
    "crates/ftui-showcase-wasm",
    "crates/ftui-simd",
    "crates/ftui-style",
    "crates/ftui-text",
    "crates/ftui-tty",
    "crates/ftui-web",
    "crates/ftui-widgets",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.6.1"
edition = "2024"
repository = "https://github.com/Dicklesworthstone/frankentui"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.ftui-extras]
opt-level = 3

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = "line-tables-only"
strip = false

[profile.bench]
debug = true
strip = false

[workspace.lints.clippy]
# Absorbs lint families newer nightlies fire on unchanged, correct code here.
# Correctness/suspicious/perf stay denied via the CI `-D warnings` gate.
# Index walks over parallel slices by a single counter; an iterator rewrite would
# obscure the arithmetic without changing behaviour.
needless_range_loop = "allow"
# Wide tuple types in internals that would not read better named.
type_complexity = "allow"
