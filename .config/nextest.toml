# cargo-nextest configuration.
#
# Why this exists: on 2026-08-28 the "Check (macos-latest, nightly)" CI job ran
# for six hours because two ftui-runtime unit tests blocked forever on a
# process-global signal slot that a parallel test had cleared. `cargo test`
# has no per-test timeout, so a hang costs the whole job budget. nextest kills
# any test that exceeds the slow-timeout so a hang costs minutes, not hours,
# and reports the test by name.
#
# Usage: `cargo nextest run --workspace --no-fail-fast` (CI) or per crate.
# `cargo test` keeps working for local runs; this file only affects nextest.

[profile.default]
# A test that runs longer than 60s is reported as slow; after two periods
# (120s) it is terminated and counted as a failure with its name in the log.
slow-timeout = { period = "60s", terminate-after = 2 }
# Keep going after a failure so one hang cannot hide the rest of the results.
fail-fast = false

# These measured latency/throughput budgets failed in the concurrent workspace
# run. Reserve the runner while measuring them, so unrelated test processes do
# not consume the budget. Isolation results remain separate from loaded runs.
# Every case and its original threshold still runs; functional concurrency
# tests keep the normal scheduler. This does not isolate other host processes.
#
# The entries from the resize-storm binary down were added later, on 2026-09-17,
# after that suite failed a rotating set of ~12 tests in every workspace run.
# They assert per-frame budgets and were spending the whole run measuring each
# other: the file completes in 2.2s because roughly fourteen of them render at
# once. Running it both ways, interleaved so the host load barely moved (1-min
# average 31.3 on either side), concurrent failed 4 of 30 and then 12 of 30
# while serial failed 0 and then 1. Serialising them costs about six seconds.
#
# Note the last line of the paragraph above, which is the limit of what this
# can do: it holds off other *nextest* tests and nothing else. When the host
# itself is oversubscribed - this machine has been seen at a 1-min load average
# of 75-128 against 14 cores, from other applications entirely - these budgets
# will still miss, and no nextest setting can prevent that.
#
# The entries below the diff baseline came from workspace and per-crate runs on
# 2026-09-17 with the resize-storm and async-tasks guardrail budgets exported,
# so their failures were not drowned in known noise. Each one passes when run
# on its own - the signature this list is for. The three editor_perf cases
# surfaced later than the rest simply because they need more host load to miss:
# they passed in a default-settings run at a 1-min average of 21 and failed at
# 46 and again at 52-70.
#
# `perf_full_navigation_sequence_100_nodes` above is the one to watch, and it
# shows how easily this list gets misread. It is already here and still fails
# in loaded runs, which first looked like a test with no headroom at all. It is
# not. Measured across load: 15 of 15 pass at a 1-min average of 17-22, 37 of
# 40 at 21-25, and 5 of 15 at 94-111. It is the most load-sensitive budget in
# the workspace - the only one that also failed running entirely alone at 39 -
# but it is not a test that fails on an unloaded machine.
#
# Its real margin is still unmeasured, because unlike resize_storm_e2e and
# async_tasks_stress it neither logs its elapsed time on success nor accepts a
# budget override, so only its failures are ever visible. Tracked as bd-eoi5v.
[[profile.default.overrides]]
filter = '''
    test(=e2e_focus_change_storm_performance)
    | test(=perf_catalog_lookup_latency)
    | test(=stress_overlay_render_widget_bounds_many_widgets)
    | test(=stress_combined_worst_case)
    | test(=proof_performance_budget)
    | test(=inspector_overlay_stress_perf)
    | test(=soak_sparklines_200_frames)
    | test(=soak_1000_widgets_sustained_rendering)
    | test(=regression_plan_row_quadratic_perf)
    | test(=style::performance_tests::test_style_merge_performance)
    | test(=height_predictor::tests::perf_prediction_overhead)
    | test(=telemetry::tests::perf_telemetry_config_jsonl_budget)
    | test(=inspector::tests::inspector_perf_budget_overlay)
    | test(=perf_full_navigation_sequence_100_nodes)
    | test(=virtualized::tests::test_variable_heights_fenwick_scales_logarithmically)
    | (binary_id(ftui-harness::resize_storm_e2e) and test(/^e2e_/))
    | test(=stress_overlay_render_full_mode_200x50)
    | test(=stress_render_matrix_sizes_and_modes)
    | test(=stress_view_render_with_many_tasks)
    | test(=regression_gate_render_latency)
    | test(=e2e_search_performance_budget)
    | test(=e2e_filter_performance_budget)
    | test(=e2e_render_with_highlights_budget)
    | test(=diff::tests::perf_block_scan_vs_scalar_baseline)
    | test(=presenter::tests::perf_cost_model_overhead)
    | test(=table::tests::render_100k_rows_stays_within_8ms_frame_budget)
    | test(=virtualized::tests::test_render_scales_with_visible_not_total)
    | test(=seed_demo_times_out_when_health_check_never_returns_result)
    | test(=regression_word_movement_large)
    | test(=stress_many_insertions)
    | test(=stress_cursor_movements)
'''
threads-required = "num-test-threads"

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false
# Retry once to distinguish a flaky timing test from a real regression; the
# retry is reported, so flakes stay visible instead of silently passing.
retries = 1
