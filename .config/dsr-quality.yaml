# Run on a configured native DSR host with its retained source checkout:
# DSR_REPOS_FILE="$PWD/.config/dsr-quality.yaml" dsr quality --tool frankentui-env-docs -w "$PWD"
# For frankentui-examples, set E2E_MINIMAL_BIN and PTY_CANONICALIZE_BIN to
# executables built from that checkout through DSR with the pinned toolchain.
# These focused gates supplement the workspace compiler/lint/doc/test gates.
# For frankentui-browser, set DSR_BROWSER_OUTPUT to a new absolute directory
# outside the source checkout. Install the pinned toolchain's wasm32 target and
# the wasm-bindgen CLI version required by both locks on the native DSR host.
schema_version: "1.0.0"
tools:
  frankentui-env-docs:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - python3 -B scripts/check_env_docs.py --self-test
      - python3 -B scripts/check_env_docs.py
      - python3 -B scripts/check_readme_claims.py --self-test
      - python3 -B scripts/check_readme_claims.py --schema-check
  # The whole non-cargo gate set, self-tests included, for the scheduled audit
  # (bd-g00-root-epic-ewths.7.1). G37 originally asked for a monthly
  # `reality_check.yml`; GitHub Actions was disabled for this project on
  # 2026-09-06, so the schedule belongs on a DSR host instead. Nothing here
  # compiles or hits the network, so it is cheap to run often:
  #   DSR_REPOS_FILE="$PWD/.config/dsr-quality.yaml" dsr quality \
  #     --tool frankentui-truth-gates -w "$PWD"
  #
  # `frankentui-env-docs` above is the narrower subset some hosts already run;
  # it is left alone so existing invocations keep working. This is the superset
  # and is the one to schedule.
  frankentui-truth-gates:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - python3 -B scripts/check_module_reachability.py --quiet
      - python3 -B scripts/check_readme_claims.py --self-test
      - python3 -B scripts/check_readme_claims.py --schema-check
      - python3 -B scripts/check_readme_claims.py --proof-refs
      - python3 -B scripts/check_readme_claims.py --experimental-check
      - python3 -B scripts/check_env_docs.py --self-test
      - python3 -B scripts/check_env_docs.py
      - python3 -B scripts/check_close_evidence.py --self-test
      - python3 -B scripts/check_close_evidence.py
      - python3 -B scripts/check_baseline_benches.py --self-test
      - python3 -B scripts/check_baseline_benches.py
      # The perf gate's own decisions, on synthetic fixtures. Nothing is
      # benchmarked or timed here, so it belongs with the stdlib gates rather
      # than in a perf lane.
      - bash scripts/check_perf_gate_decisions_e2e.sh "${DSR_PERF_GATE_RUN_ROOT:-${TMPDIR:-/tmp}/ftui_perf_gate_decisions/dsr}"
      # Proves the installed `br` still enforces .beads/policy.yaml, which the
      # audit's own self-test cannot see: a br upgrade or a schema rename would
      # leave the audit green while every close sailed through. Builds a
      # throwaway beads project under the run root and never deletes it.
      - bash scripts/check_close_policy_e2e.sh "${DSR_CLOSE_POLICY_RUN_ROOT:-${TMPDIR:-/tmp}/ftui_close_policy/dsr}"
  # The baseline cache's provenance, atomicity and comparison logic
  # (bd-g00-root-epic-ewths.9.2 item 5). 24 tests, ~3 s, no timing assertions:
  # what is gated here is the *logic* that decides whether two baselines are
  # comparable and what counts as a regression, never the measured numbers.
  #
  # Deliberately not `FTUI_BASELINE_STRICT=1`. On a fresh DSR checkout the
  # baseline is absent (gitignored), so `capture_baselines` writes one and
  # `verify_no_regression` would then compare the host against itself seconds
  # earlier — two measurements of identical code that can easily differ by more
  # than the 10% threshold on a busy box. That is a flake generator, and the
  # enforced performance gate is `scripts/perf_regression_gate.sh` against
  # `tests/baseline.json`, not this suite.
  frankentui-baseline-cache:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - cargo test -p ftui-demo-showcase --test baseline_capture
  frankentui-examples:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash tests/e2e/scripts/test_examples.sh
  frankentui-browser:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash build-wasm.sh --check-features
      - RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --locked --target wasm32-unknown-unknown -p ftui-web -p ftui-showcase-wasm
      - bash build-wasm.sh "${DSR_BROWSER_OUTPUT:?Set DSR_BROWSER_OUTPUT to a new absolute directory outside the checkout}"
  frankentui-wasm-matrix:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash build-wasm.sh --check-features
      - RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --locked --target wasm32-unknown-unknown -p ftui-core -p ftui-render -p ftui-style -p ftui-text -p ftui-layout -p ftui-runtime -p ftui-web
      - RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --locked --target wasm32-unknown-unknown -p ftui-web --features input-parser,tracing
      - RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --locked --target wasm32-unknown-unknown -p ftui-showcase-wasm
