# Run on a configured native DSR host with its retained source checkout:
# DSR_REPOS_FILE="$PWD/.config/dsr-quality.yaml" dsr quality --tool frankentui-env-docs -w "$PWD"
# For frankentui-examples, set E2E_MINIMAL_BIN and PTY_CANONICALIZE_BIN to
# executables built from that checkout through DSR with the pinned toolchain.
# These focused gates supplement the workspace compiler/lint/doc/test gates.
# For frankentui-browser, set DSR_BROWSER_OUTPUT to a new absolute directory
# outside the source checkout. Install the pinned toolchain's wasm32 target and
# the wasm-bindgen CLI version required by both locks on the native DSR host.
schema_version: "1.0.0"
tools:
  frankentui-env-docs:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - python3 -B scripts/check_env_docs.py --self-test
      - python3 -B scripts/check_env_docs.py
      - python3 -B scripts/check_readme_claims.py --self-test
      - python3 -B scripts/check_readme_claims.py --schema-check
  # The whole non-cargo gate set, self-tests included, for the scheduled audit
  # (bd-g00-root-epic-ewths.7.1). G37 originally asked for a monthly
  # `reality_check.yml`; GitHub Actions was disabled for this project on
  # 2026-09-06, so the schedule belongs on a DSR host instead. Nothing here
  # compiles or hits the network, so it is cheap to run often:
  #   DSR_REPOS_FILE="$PWD/.config/dsr-quality.yaml" dsr quality \
  #     --tool frankentui-truth-gates -w "$PWD"
  #
  # `frankentui-env-docs` above is the narrower subset some hosts already run;
  # it is left alone so existing invocations keep working. This is the superset
  # and is the one to schedule.
  frankentui-truth-gates:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - python3 -B scripts/check_module_reachability.py --quiet
      - python3 -B scripts/check_readme_claims.py --self-test
      - python3 -B scripts/check_readme_claims.py --schema-check
      - python3 -B scripts/check_readme_claims.py --proof-refs
      - python3 -B scripts/check_readme_claims.py --experimental-check
      - python3 -B scripts/check_readme_claims.py --check
      - python3 -B -m unittest scripts/tests/test_check_readme_claims.py
      - python3 -B scripts/check_env_docs.py --self-test
      - python3 -B scripts/check_env_docs.py
      - python3 -B scripts/check_close_evidence.py --self-test
      - python3 -B scripts/check_close_evidence.py
      - python3 -B scripts/check_close_evidence.py --alerts
      - mkdir -p "${DSR_TRUTH_GATES_RUN_ROOT:-${TMPDIR:-/tmp}/ftui_truth_gates/dsr}" && bv --robot-alerts > "${DSR_TRUTH_GATES_RUN_ROOT:-${TMPDIR:-/tmp}/ftui_truth_gates/dsr}/bv_alerts.json"
      - python3 -B scripts/check_baseline_benches.py --self-test
      - python3 -B scripts/check_baseline_benches.py
      # Ensure standalone fuzz/Cargo.toml [workspace.lints.clippy] stays in sync
      # with the root Cargo.toml (bd-g00-root-epic-ewths.6.9 / .6.10).
      - python3 -c 'import sys, tomllib; r = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["lints"]["clippy"]; f = tomllib.load(open("fuzz/Cargo.toml", "rb"))["workspace"]["lints"]["clippy"]; sys.exit(0 if r == f else f"fuzz/Cargo.toml clippy lints drifted ({f} != {r})")'
      # The perf gate's own decisions, on synthetic fixtures. Nothing is
      # benchmarked or timed here, so it belongs with the stdlib gates rather
      # than in a perf lane.
      - bash scripts/check_perf_gate_decisions_e2e.sh "${DSR_PERF_GATE_RUN_ROOT:-${TMPDIR:-/tmp}/ftui_perf_gate_decisions/dsr}"
      - python3 -B scripts/render_perf_readme.py --self-test
      - python3 -B scripts/render_perf_readme.py --check
      # Proves the installed `br` still enforces .beads/policy.yaml, which the
      # audit's own self-test cannot see: a br upgrade or a schema rename would
      # leave the audit green while every close sailed through. Builds a
      # throwaway beads project under the run root and never deletes it.
      - bash scripts/check_close_policy_e2e.sh "${DSR_CLOSE_POLICY_RUN_ROOT:-${TMPDIR:-/tmp}/ftui_close_policy/dsr}"
      # Release preflight + publish helper self-tests (bd-g00-root-epic-ewths.10.1, .6.22).
      - bash scripts/release_preflight_test.sh
      - bash scripts/ci/release_publish_test.sh
      # Toolchain pin parser + active compiler/lockfile contract self-tests (bd-g00-root-epic-ewths.6.19, .6.20, .6.29, .6.30).
      - bash scripts/ci/parse_toolchain_pin_test.sh
      - bash scripts/ci/toolchain_pin_contract_test.sh
      # Pinned capture tools (VHS 0.10.0 + ttyd 1.7.7) + doctor snapshot/bundle verification (bd-g00-root-epic-ewths.6.14).
      - bash scripts/ci/capture_tools_test.sh
      # Static workflow + DSR doctor verification contract assertions (bd-g00-root-epic-ewths.28.4).
      - python3 -B scripts/check_workflows.py --self-test
      - python3 -B scripts/check_workflows.py
      # Tree-derived README/AGENTS inventory facts and drift gate (bd-g00-root-epic-ewths.5.11).
      - python3 -B scripts/repo_facts.py --self-test
      - python3 -B scripts/repo_facts.py --check
      # Vision scorecard synthetic self-test (bd-g00-root-epic-ewths.42.6).
      - python3 -B scripts/vision_scorecard.py --self-test
  # The AGENTS.md "Landing the Plane" gate set on the native host, without RCH
  # (forbidden until bd-g00-root-epic-ewths.6.24): `cargo` on this host's PATH
  # is an RCH shim, so every cargo line carries RCH_CARGO_WRAPPER_BYPASS=1, the
  # pinned toolchain and content fingerprints. The 2026-10-02 v0.9.0 wave ran
  # these checks through `rch exec` from an ad hoc config and failed 4 of 5 on
  # RCH itself (bd-g00-root-epic-ewths.6.37). Set CARGO_TARGET_DIR to a target
  # directory this run owns; shared ones get poisoned by concurrent builds.
  #   DSR_REPOS_FILE="$PWD/.config/dsr-quality.yaml" dsr quality \
  #     --tool frankentui-full-gates -w "$PWD"
  frankentui-full-gates:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - make gates
      - bash scripts/ci/toolchain_pin_contract.sh --check-git-lockfile
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') cargo fmt --all --check
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --workspace --all-targets --locked
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness clippy --workspace --all-targets --locked -- -D warnings
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTDOCFLAGS="-D warnings" RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness doc --workspace --no-deps --locked
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness nextest run --workspace --no-fail-fast --locked
  # The baseline cache's provenance, atomicity and comparison logic
  # (bd-g00-root-epic-ewths.9.2 item 5). 24 tests, ~3 s, no timing assertions:
  # what is gated here is the *logic* that decides whether two baselines are
  # comparable and what counts as a regression, never the measured numbers.
  #
  # Deliberately not `FTUI_BASELINE_STRICT=1`. On a fresh DSR checkout the
  # baseline is absent (gitignored), so `capture_baselines` writes one and
  # `verify_no_regression` would then compare the host against itself seconds
  # earlier — two measurements of identical code that can easily differ by more
  # than the 10% threshold on a busy box. That is a flake generator, and the
  # enforced performance gate is `scripts/perf_regression_gate.sh` against
  # `tests/baseline.json`, not this suite.
  frankentui-baseline-cache:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness test --locked -p ftui-demo-showcase --test baseline_capture
  frankentui-examples:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash tests/e2e/scripts/test_examples.sh
  # Render + Pane E2E acceptance gates (bd-g00-root-epic-ewths.6.27, .6.28):
  # runs `scripts/e2e_test.sh --quick` and `scripts/pane_e2e.sh --mode smoke`
  # with strict JSONL schema and hash-registry validation. Full/stress modes
  # (`./scripts/e2e_test.sh` and `./scripts/pane_e2e.sh --mode full`) run in
  # scheduled extended sweeps.
  frankentui-render-pane-e2e:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') E2E_JSONL_VALIDATE=1 E2E_JSONL_VALIDATE_MODE=strict bash scripts/e2e_test.sh --quick
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') E2E_JSONL_VALIDATE=1 E2E_JSONL_VALIDATE_MODE=strict bash scripts/pane_e2e.sh --mode smoke
  # G48 (bd-g00-root-epic-ewths.47.4): every inline log line reaches real
  # multiplexer history. Needs tmux, GNU screen and zellij on the host; a
  # missing one FAILS its cases unless named in FTUI_E2E_MUX_OUT_OF_SCOPE
  # (logged). Sessions are private; captures are retained under
  # DSR_INLINE_SCROLLBACK_OUTPUT, a new absolute directory outside the checkout.
  # It also runs agent_shell --pty (G26, .32.5): an isatty-gated child per
  # multiplexer, and under tmux the process-group cleanup on quit. cargo is an
  # RCH shim on this host, hence RCH_CARGO_WRAPPER_BYPASS=1 (see full-gates).
  frankentui-inline-scrollback:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness build --locked -p ftui --example agent_shell -p ftui-demo-showcase --bin ftui-demo-showcase
      - python3 -B tests/e2e/scripts/test_inline_scrollback_mux.py --agent-shell "${CARGO_TARGET_DIR:-target}/debug/examples/agent_shell" --showcase "${CARGO_TARGET_DIR:-target}/debug/ftui-demo-showcase" --lines 10000 --out "${DSR_INLINE_SCROLLBACK_OUTPUT:?Set DSR_INLINE_SCROLLBACK_OUTPUT to a new absolute directory outside the checkout}"
      # The same agent shell in a plain PTY (no multiplexer), with and without
      # CPR replies, against ftui-pty's terminal model (.47.4 item 2).
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness nextest run --locked -p ftui --test agent_shell_plain_pty --no-fail-fast
  frankentui-browser:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash build-wasm.sh --check-features
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --locked --target wasm32-unknown-unknown -p ftui-web -p ftui-showcase-wasm
      - bash build-wasm.sh "${DSR_BROWSER_OUTPUT:?Set DSR_BROWSER_OUTPUT to a new absolute directory outside the checkout}"
  frankentui-wasm-matrix:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash build-wasm.sh --check-features
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --locked --target wasm32-unknown-unknown -p ftui-core -p ftui-render -p ftui-style -p ftui-text -p ftui-layout -p ftui-runtime -p ftui-web
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --locked --target wasm32-unknown-unknown -p ftui-web --features input-parser,tracing
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --locked --target wasm32-unknown-unknown -p ftui-showcase-wasm
  # Feature-gated modules (bd-g00-root-epic-ewths.6.38): ~2,160+ tests across
  # experimental runtime modules, ftui-extras features, normalization, and
  # telemetry that default `--workspace` never compiles.
  frankentui-all-features:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness check --workspace --all-targets --all-features --locked
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTDOCFLAGS="-D warnings" RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness doc --workspace --all-features --no-deps --locked
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness nextest run --workspace --all-features --no-fail-fast --locked
  # Release-profile performance budget suites (bd-g00-root-epic-ewths.6.38):
  # perf_hud_regression, mermaid_perf_budget, and visual_effects_pty skip their
  # release-only frame budget assertions when debug_assertions are enabled.
  frankentui-release-perf-budgets:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness nextest run --cargo-profile release --locked -p ftui-demo-showcase --test perf_hud_regression --test mermaid_perf_budget --test visual_effects_pty --no-fail-fast
  # Scheduled and on-demand DSR fuzz campaign (bd-g00-root-epic-ewths.6.10,
  # bd-g00-root-epic-ewths.8.1): builds all 12 declared cargo-fuzz targets with
  # the pinned nightly toolchain and content fingerprints, runs the retained
  # libFuzzer binaries directly against fuzz/corpus/<target>, emits JSONL
  # execution/coverage/corpus_size evidence and corpus_stats.txt, and fails on
  # any crash or incomplete target.
  frankentui-fuzz-campaign:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - RCH_CARGO_WRAPPER_BYPASS=1 FUZZ_DURATION_SECS="${FUZZ_DURATION_SECS:-60}" bash scripts/fuzz_campaign_e2e.sh
  # Pre-release preflight verification gate (bd-g00-root-epic-ewths.10.1):
  # runs the synthetic fixture tests plus strict 14-check preflight against the
  # workspace version (or DSR_RELEASE_TAG).
  frankentui-release-preflight:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash scripts/release_preflight_test.sh
      - bash scripts/ci/release_publish_test.sh
      - bash scripts/release_preflight.sh "${DSR_RELEASE_TAG:-v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')}" --strict --out "${DSR_PREFLIGHT_OUT:-${TMPDIR:-/tmp}/ftui_release_preflight.jsonl}"
  # Windows cross-target and start/stop smoke verification (bd-g00-root-epic-ewths.6.5,
  # bd-g00-root-epic-ewths.36.1, bd-g00-root-epic-ewths.36.2).
  frankentui-windows-cross:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash scripts/cross_platform_e2e.sh --windows-smoke
  # Full G25 performance regression gate E2E (bd-g00-root-epic-ewths.31.6):
  # runs the 27-threshold Criterion + byte-budget + FrameArena allocation gate,
  # validates the JSONL report schema, verifies injected regression detection,
  # and checks README/baseline markdown provenance.
  frankentui-perf-gate:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - RCH_CARGO_WRAPPER_BYPASS=1 bash scripts/perf_gate_e2e.sh --full
  # Canonical doctor_frankentui verification stack (bd-g00-root-epic-ewths.28.2,
  # bd-g00-root-epic-ewths.28.4, bd-g00-root-epic-ewths.28.6): runs core unit +
  # integration tests, core test-time budget check, happy/failure/determinism/
  # replay-triage/coverage gates, and validates the retained artifact bundle +
  # JSONL schema under /tmp/doctor_frankentui_ci/.
  frankentui-doctor-verification:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - bash scripts/ci/capture_tools_test.sh
      - RCH_CARGO_WRAPPER_BYPASS=1 RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])') CARGO_BUILD_FINGERPRINT=content CARGO_CACHE_AUTO_CLEAN_FREQUENCY=never cargo -Zchecksum-freshness test --locked -p doctor_frankentui --all-targets -- --nocapture
      - bash scripts/doctor_frankentui_core_time_budget.sh
      - bash scripts/doctor_frankentui_happy_e2e.sh "${DOCTOR_FTUI_ARTIFACT_ROOT:-/tmp/doctor_frankentui_ci}/happy"
      - bash scripts/doctor_frankentui_failure_e2e.sh "${DOCTOR_FTUI_ARTIFACT_ROOT:-/tmp/doctor_frankentui_ci}/failure"
      - python3 -B scripts/doctor_frankentui_replay_triage.py --run-root "${DOCTOR_FTUI_ARTIFACT_ROOT:-/tmp/doctor_frankentui_ci}/failure" --max-signals 8
      - bash scripts/doctor_frankentui_determinism_soak.sh "${DOCTOR_FTUI_ARTIFACT_ROOT:-/tmp/doctor_frankentui_ci}/determinism" 3
      - bash scripts/doctor_frankentui_coverage.sh "${DOCTOR_FTUI_ARTIFACT_ROOT:-/tmp/doctor_frankentui_ci}/coverage"
      - python3 -B scripts/doctor_frankentui_validate_jsonl.py --bundle-root "${DOCTOR_FTUI_ARTIFACT_ROOT:-/tmp/doctor_frankentui_ci}" --write-artifact-map
  # G42 (bd-g00-root-epic-ewths.42.6): executable vision scorecard across truth
  # gates, all 45 showcase screens in a real PTY, core examples, DEC 2026 sync
  # bracket balance, inline scrollback across 4 terminal identities, and real
  # tmux history preservation.
  frankentui-vision-scorecard:
    repo: Dicklesworthstone/frankentui
    language: rust
    required_checks:
      - python3 -B scripts/vision_scorecard.py --self-test
      - RCH_CARGO_WRAPPER_BYPASS=1 python3 -B scripts/vision_scorecard.py --skip-cargo-sweeps --out "${DSR_VISION_SCORECARD_OUT:-${TMPDIR:-/tmp}/ftui_vision_scorecard/dsr}"

