      - name: Run doctor_frankentui determinism soak (extended)
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_determinism_soak.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/determinism" 5 \
