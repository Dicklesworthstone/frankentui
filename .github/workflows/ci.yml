# FrankenTUI CI/CD Pipeline
# bd-2nu8.13: Continuous integration for code quality and testing
#
# Runs on every PR and push to main branch.
# Matrix tests across OS and Rust versions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Check Job: Format, Clippy, Tests
  # ==========================================================================
  check:
    name: Check (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, nightly]
        include:
          - os: windows-latest
            rust: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Enforce no-mock policy (bd-2nu8.18)
        run: |
          if rg -n -i '\b(mock|fake|stub)s?\b' crates tests -g '*.rs' \
            --glob '!crates/ftui-runtime/src/subscription.rs' \
            --glob '!crates/ftui-core/src/inline_mode.rs' \
            --glob '!crates/ftui-widgets/src/debug_overlay.rs' \
            --glob '!crates/ftui-render/src/sanitize.rs'; then
            echo "No-mock policy violation detected. See docs/testing/no-mock-policy.md."
            exit 1
          fi

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --lib

      - name: Run tests (all features)
        run: cargo test --workspace --all-features
        if: matrix.rust == 'nightly'

  # ==========================================================================
  # Docs Job: Rustdoc + Examples
  # ==========================================================================
  docs:
    name: Docs (rustdoc + examples)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-nightly-

      - name: Run rustdoc tests
        run: cargo test --doc --workspace

      - name: Build ftui-harness examples
        run: cargo build --examples -p ftui-harness

  # ==========================================================================
  # Feature Combinations Job
  # ==========================================================================
  features:
    name: Feature Combinations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}

      - name: Test ftui-extras features
        run: |
          for feature in canvas charts forms markdown export clipboard syntax image live logging filepicker; do
            echo "Testing ftui-extras --features $feature"
            cargo check -p ftui-extras --features "$feature"
          done

      - name: Test ftui-widgets features
        run: cargo check -p ftui-widgets --features debug-overlay

      - name: Test no default features
        run: cargo check --workspace --no-default-features

  # ==========================================================================
  # Coverage Job
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-targets --all-features --lcov --output-path lcov.info

      - name: Enforce coverage thresholds
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import sys

          lcov_path = Path("lcov.info")
          if not lcov_path.exists():
              raise SystemExit("lcov.info not found; coverage gate cannot run")

          def threshold(crate: str, default: float) -> float:
              env_key = f"COVERAGE_MIN_{crate.upper().replace('-', '_')}"
              raw = os.environ.get(env_key)
              if raw is None:
                  return default
              try:
                  return float(raw)
              except ValueError as exc:
                  raise SystemExit(f"Invalid {env_key}={raw!r}: {exc}") from exc

          thresholds = {
              # Correctness-critical crates get stricter floors.
              "ftui-render": threshold("ftui-render", 85.0),
              "ftui-core": threshold("ftui-core", 85.0),
              "ftui-style": threshold("ftui-style", 80.0),
              "ftui-text": threshold("ftui-text", 80.0),
              "ftui-layout": threshold("ftui-layout", 75.0),
              "ftui-runtime": threshold("ftui-runtime", 75.0),
              "ftui-widgets": threshold("ftui-widgets", 70.0),
              "ftui-extras": threshold("ftui-extras", 60.0),
          }
          overall_raw = os.environ.get("COVERAGE_MIN_OVERALL", "75.0")
          try:
              overall_target = float(overall_raw)
          except ValueError as exc:
              raise SystemExit(f"Invalid COVERAGE_MIN_OVERALL={overall_raw!r}: {exc}") from exc

          crate_totals = {crate: {"LF": 0, "LH": 0} for crate in thresholds}
          overall = {"LF": 0, "LH": 0}

          current = None
          for raw in lcov_path.read_text().splitlines():
              line = raw.strip()
              if line.startswith("SF:"):
                  current = {"file": line[3:], "LF": 0, "LH": 0}
              elif line.startswith("LF:") and current is not None:
                  current["LF"] = int(line[3:])
              elif line.startswith("LH:") and current is not None:
                  current["LH"] = int(line[3:])
              elif line == "end_of_record" and current is not None:
                  overall["LF"] += current["LF"]
                  overall["LH"] += current["LH"]
                  marker = "/crates/"
                  path = current["file"]
                  if marker in path:
                      crate = path.split(marker, 1)[1].split("/", 1)[0]
                      if crate in crate_totals:
                          crate_totals[crate]["LF"] += current["LF"]
                          crate_totals[crate]["LH"] += current["LH"]
                  current = None

          def pct(hit: int, total: int) -> float:
              return 0.0 if total == 0 else (100.0 * hit / total)

          failures = []
          for crate, totals in sorted(crate_totals.items()):
              value = pct(totals["LH"], totals["LF"])
              target = thresholds[crate]
              delta = value - target
              if delta < 0:
                  failures.append((crate, value, target, delta))

          overall_pct = pct(overall["LH"], overall["LF"])
          if overall_pct < overall_target:
              failures.append(("overall", overall_pct, overall_target, overall_pct - overall_target))

          if failures:
              print("Coverage gate failed:")
              for crate, value, target, delta in failures:
                  print(f"- {crate}: {value:.2f}% (target {target:.2f}%, delta {delta:.2f}%)")
              sys.exit(1)

          print(f"Coverage gate passed: overall {overall_pct:.2f}% (target {overall_target:.2f}%)")
          for crate, totals in sorted(crate_totals.items()):
              value = pct(totals["LH"], totals["LF"])
              target = thresholds[crate]
              delta = value - target
              print(f"- {crate}: {value:.2f}% (target {target:.2f}%, delta {delta:+.2f}%)")
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # Benchmarks Job (push to main only)
  # ==========================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run perf gates (bd-3cwi, bd-lff4p.5.5)
        # CI bench runs are noisy: --quick uses sample-size 10 and
        # measurement-time 100ms, which makes the dense-regression dirty/full
        # ratio swing wildly even when nothing has changed (observed ratios
        # 0.80 - 1.32 on identical commits). The gate's intent is to flag
        # large pessimisations like 2x; loosen the threshold for CI while
        # keeping it tight for local "cargo bench" runs.
        env:
          FTUI_SPAN_DENSE_MAX_OVERHEAD: "1.50"
          FTUI_TILE_DENSE_MAX_OVERHEAD: "1.50"
        run: ./scripts/bench_budget.sh --quick

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: target/benchmark-results
          retention-days: 30

  # ==========================================================================
  # Documentation Job
  # ==========================================================================
  docs-build:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: target/doc
          retention-days: 7

  # ==========================================================================
  # Widget API E2E Test Job
  # ==========================================================================
  e2e-widget-api:
    name: Widget API E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-widget-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Widget API E2E tests
        env:
          E2E_JSONL_VALIDATE: "1"
          E2E_JSONL_VALIDATE_MODE: strict
        run: ./scripts/widget_api_e2e.sh

      - name: Validate Widget API E2E JSONL logs
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/widget_api_e2e_*/widget_api_e2e.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "No widget API JSONL logs found under /tmp/widget_api_e2e_*/widget_api_e2e.jsonl"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            python3 tests/e2e/lib/validate_jsonl.py "$file" \
              --schema tests/e2e/lib/e2e_jsonl_schema.json \
              --registry tests/e2e/lib/e2e_hash_registry.json \
              --strict
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: widget-api-e2e-logs
          path: /tmp/widget_api_e2e_*/
          retention-days: 7

  # ==========================================================================
  # Demo Showcase E2E Job
  # ==========================================================================
  demo-showcase:
    name: Demo Showcase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-demo-showcase-${{ hashFiles('**/Cargo.lock') }}

      - name: Run demo showcase E2E tests
        env:
          E2E_JSONL_VALIDATE: "1"
          E2E_JSONL_VALIDATE_MODE: strict
        run: ./scripts/demo_showcase_e2e.sh

      - name: Validate demo showcase JSONL logs
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/ftui-demo-e2e-*/demo_showcase_e2e.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "No demo showcase JSONL logs found under /tmp/ftui-demo-e2e-*/demo_showcase_e2e.jsonl"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            python3 tests/e2e/lib/validate_jsonl.py "$file" \
              --schema tests/e2e/lib/e2e_jsonl_schema.json \
              --registry tests/e2e/lib/e2e_hash_registry.json \
              --strict
          done

      - name: Run snapshot tests
        run: cargo test -p ftui-demo-showcase --test screen_snapshots

      - name: Golden checksum verification (bd-3jlw5.2)
        run: cargo test -p ftui-demo-showcase --test golden_checksums -- golden_checksums_verify golden_checksums_deterministic --nocapture

      - name: Terminal/Web parity gate (all screens + interactions)
        run: cargo test -p ftui-demo-showcase --test terminal_web_parity -- --nocapture

      - name: Pane interaction parity gate
        run: cargo test -p ftui-showcase-wasm pane_interaction_trace_is_deterministic -- --nocapture

      - name: Baseline benchmark capture (bd-3jlw5.1)
        run: cargo test -p ftui-demo-showcase --test baseline_capture -- --nocapture

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-showcase-e2e-logs
          path: /tmp/ftui-demo-e2e-*/
          retention-days: 7

  # ==========================================================================
  # PTY E2E Test Job (harness + terminal tests)
  # ==========================================================================
  e2e-pty:
    name: PTY E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-pty-${{ hashFiles('**/Cargo.lock') }}

      - name: Run native PTY E2E suite (run_all.sh)
        env:
          E2E_JSONL_VALIDATE: "1"
          E2E_JSONL_VALIDATE_MODE: strict
        run: |
          set -euo pipefail
          ./tests/e2e/scripts/run_all.sh

      - name: Validate PTY E2E JSONL logs
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/ftui_e2e_*/e2e.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "No PTY E2E JSONL logs found under /tmp/ftui_e2e_*/e2e.jsonl"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            python3 tests/e2e/lib/validate_jsonl.py "$file" \
              --schema tests/e2e/lib/e2e_jsonl_schema.json \
              --registry tests/e2e/lib/e2e_hash_registry.json \
              --strict
          done

      - name: Build PTY failure repro bundle
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundle_root="/tmp/ftui_e2e_failure_bundle_${{ matrix.os }}"
          mkdir -p "$bundle_root"

          summary_files=(/tmp/ftui_e2e_*/results/summary.json)
          if (( ${#summary_files[@]} == 0 )); then
            echo "No PTY E2E summary files were generated." > "$bundle_root/README.txt"
            exit 0
          fi

          {
            echo "# PTY E2E Minimal Repros"
            echo
            echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
            echo "Each failed test maps to its minimal repro script in \`tests/e2e/scripts/\`."
            echo
          } > "$bundle_root/minimal_repros.md"

          for summary in "${summary_files[@]}"; do
            run_dir="$(dirname "$(dirname "$summary")")"
            run_name="$(basename "$run_dir")"
            cp "$summary" "$bundle_root/${run_name}_summary.json"

            failed_count="$(jq -r '.failed // 0' "$summary" 2>/dev/null || echo 0)"
            if [[ "$failed_count" == "0" ]]; then
              continue
            fi

            jq -r '.tests[] | select(.status=="failed") | .name' "$summary" > "$bundle_root/${run_name}_failed_tests.txt"

            while IFS= read -r test_name; do
              [[ -n "$test_name" ]] || continue

              suite_name="${test_name%%_*}"
              script_path="tests/e2e/scripts/test_${suite_name}.sh"
              case_script="tests/e2e/scripts/test_${test_name}.sh"
              if [[ ! -f "$script_path" && -f "$case_script" ]]; then
                script_path="$case_script"
              fi
              if [[ ! -f "$script_path" ]]; then
                candidate="$(rg --files tests/e2e/scripts | rg "/test_(${suite_name}|${test_name})\\.sh$" | head -n1 || true)"
                if [[ -n "$candidate" ]]; then
                  script_path="$candidate"
                else
                  script_path="(script not found)"
                fi
              fi

              echo "- \`${test_name}\`: \`${script_path}\`" >> "$bundle_root/minimal_repros.md"

              log_file="$run_dir/e2e.log"
              excerpt_file="$bundle_root/${run_name}_${test_name}_excerpt.log"
              if [[ -f "$log_file" ]]; then
                awk -v needle="$test_name" '
                  index($0, needle) {
                    start = NR - 20;
                    if (start < 1) start = 1;
                    end = NR + 40;
                  }
                  NR >= start && NR <= end { print }
                ' "$log_file" > "$excerpt_file" || true
              fi

              pty_file="$run_dir/${test_name}.pty"
              if [[ -f "$pty_file" ]]; then
                xxd -l 512 "$pty_file" > "$bundle_root/${run_name}_${test_name}_pty_head.hex" || true
              fi
            done < "$bundle_root/${run_name}_failed_tests.txt"
          done

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pty-logs-${{ matrix.os }}
          path: /tmp/ftui_e2e_*/
          retention-days: 7

      - name: Upload PTY E2E JSONL logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pty-jsonl-${{ matrix.os }}
          path: /tmp/ftui_e2e_*/**/*.jsonl
          retention-days: 7
          if-no-files-found: error

      - name: Upload PTY failure repro bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pty-failure-bundle-${{ matrix.os }}
          path: /tmp/ftui_e2e_failure_bundle_${{ matrix.os }}/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pty-summary-${{ matrix.os }}
          path: /tmp/ftui_e2e_*/results/summary.json
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # Golden Trace Replay Gates (core + web + remote where feasible)
  # ==========================================================================
  golden-trace-gates:
    name: Golden Trace Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-golden-trace-${{ hashFiles('**/Cargo.lock') }}

      - name: Core replay gate (schedule trace checksums)
        run: ./tests/e2e/scripts/test_schedule_trace.sh

      - name: Web replay gate (actionable frame/event diffs)
        run: |
          set -euo pipefail
          cargo test -p ftui-web session_record::tests::gate_trace_passes_on_correct_replay -- --nocapture
          cargo test -p ftui-web session_record::tests::gate_trace_fails_with_actionable_diff -- --nocapture
          cargo test -p ftui-web session_record::tests::gate_trace_diff_has_event_context -- --nocapture

      - name: Advanced host API compatibility harness (release gate)
        run: |
          set -euo pipefail
          # bd-2vr05.13.6 — single release-blocking gate over every in-tree
          # advanced host API subsystem (parser hooks, markers/viewport anchors,
          # runtime options bd-2vr05.13.5, and event/IME ordering). Aggregates
          # each subsystem's structured evidence into one compatibility manifest
          # and fails on missing coverage or any failed cell.
          ./scripts/frankenterm_js_advanced_api_compat.sh

      - name: Addon-parity compatibility harness (release gate)
        run: |
          set -euo pipefail
          # bd-2vr05.14.6 — single release-blocking gate over every in-tree
          # addon-parity subsystem (fit-to-container + web-font metrics, OSC-8
          # web links, inline-image protocol detection, and ligature/shaping
          # fallback). Aggregates each subsystem's structured evidence into one
          # compatibility manifest and fails on missing coverage or any failed
          # cell.
          ./scripts/frankenterm_js_addon_parity_compat.sh

      - name: SDK contract compatibility harness (release gate)
        run: |
          set -euo pipefail
          # bd-2vr05.9.2 — release-blocking gate over the in-tree typed SDK
          # event/error model (ftui_web::sdk_event_model). Proves the host event
          # taxonomy, typed error codes, and bounded-buffer policy are
          # unique/sorted/round-trip, and that the committed TypeScript
          # definitions (crates/ftui-web/sdk/frankenterm-js-events.d.ts) stay in
          # lockstep with the Rust model. Fails on missing coverage, any failed
          # cell, malformed JSON, or absent failure-injection coverage.
          ./scripts/frankenterm_js_sdk_contract_compat.sh

      - name: Harness replay gate (time-bounded PR profile)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cargo test -p ftui-harness trace_replay -- --nocapture

      - name: Harness replay gate (expanded main/nightly profile)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cargo test -p ftui-harness trace_replay -- --nocapture
          cargo test -p ftui-harness checksum -- --nocapture

      - name: Remote replay gate (when available)
        run: |
          set -euo pipefail
          if [[ -x "./tests/e2e/scripts/test_frankenterm_event_ordering_contract.sh" ]]; then
            ./tests/e2e/scripts/test_frankenterm_event_ordering_contract.sh
          fi
          if [[ -x "./tests/e2e/scripts/test_frankenterm_markers_decorations.sh" ]]; then
            ./tests/e2e/scripts/test_frankenterm_markers_decorations.sh
          fi
          shopt -s nullglob
          remote_scripts=(tests/e2e/scripts/test_remote*.sh)
          if [[ -x "./scripts/remote_terminal_e2e.sh" ]]; then
            ./scripts/remote_terminal_e2e.sh
          elif (( ${#remote_scripts[@]} > 0 )); then
            for script in "${remote_scripts[@]}"; do
              base_script="$(basename "$script")"
              case "$base_script" in
                test_remote_all.sh|test_remote_typography_rescale.sh|test_remote_resize_storm.sh|test_remote_unicode.sh|test_remote_scrollback.sh)
                  echo "Skipping $script (covered by dedicated typography/rescale release gate step)."
                  continue
                  ;;
              esac
              echo "Running $script"
              "$script"
            done
          else
            echo "No remote replay scripts are present yet; skipping remote gate."
          fi

      - name: Typography/rescale release gate (correctness + perf + logs)
        run: |
          set -euo pipefail
          export E2E_DETERMINISTIC=1
          export E2E_TIME_STEP_MS=100
          export E2E_SEED=0
          export E2E_LOG_DIR=/tmp/frankenterm_release_gates
          bash ./tests/e2e/scripts/test_remote_typography_rescale.sh

      - name: Build typography/rescale go-no-go evidence bundle
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="/tmp/frankenterm_release_gates"
          SUITE_ROOT="${ARTIFACT_ROOT}/remote_typography_rescale"
          SUITE_JSONL="${SUITE_ROOT}/typography_rescale_e2e.jsonl"
          SUITE_REPORT="${SUITE_ROOT}/typography_rescale_e2e_report.json"
          GO_NO_GO_JSON="${SUITE_ROOT}/go_no_go_report.json"
          GO_NO_GO_TXT="${SUITE_ROOT}/go_no_go_report.txt"
          ARTIFACT_MAP_TXT="${SUITE_ROOT}/artifact_map.txt"
          ARTIFACT_MAP_JSON="${SUITE_ROOT}/artifact_map.json"

          python3 - "$SUITE_JSONL" "$SUITE_REPORT" "$GO_NO_GO_JSON" "$GO_NO_GO_TXT" "$ARTIFACT_MAP_TXT" "$ARTIFACT_MAP_JSON" <<'PY'
          import json
          import math
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          def load_json(path: Path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"failed to parse JSON file {path}: {exc}") from exc

          def load_jsonl(path: Path):
              rows = []
              for idx, line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  raw = line.strip()
                  if not raw:
                      continue
                  try:
                      row = json.loads(raw)
                  except Exception as exc:
                      raise SystemExit(f"{path}:{idx}: invalid JSONL entry: {exc}") from exc
                  if not isinstance(row, dict):
                      raise SystemExit(f"{path}:{idx}: expected object JSONL row")
                  rows.append(row)
              if not rows:
                  raise SystemExit(f"{path}: JSONL is empty")
              return rows

          def percentile(values, pct):
              if not values:
                  return None
              ordered = sorted(float(v) for v in values)
              if len(ordered) == 1:
                  return ordered[0]
              rank = pct * (len(ordered) - 1)
              lo = math.floor(rank)
              hi = math.ceil(rank)
              if lo == hi:
                  return ordered[lo]
              weight = rank - lo
              return ordered[lo] * (1.0 - weight) + ordered[hi] * weight

          suite_jsonl = Path(sys.argv[1])
          suite_report = Path(sys.argv[2])
          go_no_go_json = Path(sys.argv[3])
          go_no_go_txt = Path(sys.argv[4])
          artifact_map_txt = Path(sys.argv[5])
          artifact_map_json = Path(sys.argv[6])

          required_paths = [suite_jsonl, suite_report]
          for path in required_paths:
              if not path.exists():
                  raise SystemExit(f"required artifact missing: {path}")

          report = load_json(suite_report)
          suite_events = load_jsonl(suite_jsonl)
          suite_event_types = {event.get("type") for event in suite_events}

          perf_thresholds = {
              "p95_present_ms_max": 120.0,
              "max_present_ms_max": 250.0,
          }

          failures = []
          if report.get("status") != "pass":
              failures.append(f"suite report status is not pass: {report.get('status')!r}")

          required_suite_event_types = {"suite_start", "suite_case_summary", "suite_end"}
          missing_event_types = sorted(required_suite_event_types - suite_event_types)
          if missing_event_types:
              failures.append(f"suite JSONL missing required event types: {missing_event_types}")

          cases = report.get("cases")
          if not isinstance(cases, list) or not cases:
              failures.append("suite report has no case summaries")
              cases = []

          case_metrics = []
          report_artifacts = report.get("artifacts", {})
          artifact_paths = {
              "suite_jsonl": str(suite_jsonl),
              "suite_report": str(suite_report),
          }
          for key, value in sorted(report_artifacts.items()):
              if isinstance(value, str) and value:
                  artifact_paths[key] = value

          for case in cases:
              case_name = case.get("case")
              case_jsonl_path = case.get("jsonl_path")
              if not isinstance(case_name, str) or not case_name:
                  failures.append(f"case entry missing case name: {case}")
                  continue
              if not isinstance(case_jsonl_path, str) or not case_jsonl_path:
                  failures.append(f"{case_name}: missing jsonl_path")
                  continue

              case_path = Path(case_jsonl_path)
              if not case_path.exists():
                  failures.append(f"{case_name}: missing case JSONL artifact: {case_path}")
                  continue

              case_events = load_jsonl(case_path)
              frame_events = [e for e in case_events if e.get("type") == "frame"]
              present_values = [
                  float(e.get("present_ms"))
                  for e in frame_events
                  if isinstance(e.get("present_ms"), (int, float))
              ]
              p95_present_ms = percentile(present_values, 0.95)
              max_present_ms = max(present_values) if present_values else None

              case_failed_asserts = int(case.get("failed_assert_count", 0))
              case_errors = int(case.get("error_count", 0))
              case_frames = int(case.get("frame_count", 0))

              if case_failed_asserts != 0:
                  failures.append(f"{case_name}: failed_assert_count={case_failed_asserts}")
              if case_errors != 0:
                  failures.append(f"{case_name}: error_count={case_errors}")
              if case_frames <= 0:
                  failures.append(f"{case_name}: frame_count must be > 0 (got {case_frames})")

              if p95_present_ms is None:
                  failures.append(f"{case_name}: no numeric frame.present_ms values found")
              elif p95_present_ms > perf_thresholds["p95_present_ms_max"]:
                  failures.append(
                      f"{case_name}: p95_present_ms={p95_present_ms:.3f} exceeds "
                      f"{perf_thresholds['p95_present_ms_max']:.1f}ms threshold"
                  )

              if max_present_ms is None:
                  failures.append(f"{case_name}: no max present_ms could be computed")
              elif max_present_ms > perf_thresholds["max_present_ms_max"]:
                  failures.append(
                      f"{case_name}: max_present_ms={max_present_ms:.3f} exceeds "
                      f"{perf_thresholds['max_present_ms_max']:.1f}ms threshold"
                  )

              case_metrics.append(
                  {
                      "case": case_name,
                      "frame_count": len(frame_events),
                      "event_count": len(case_events),
                      "p95_present_ms": None if p95_present_ms is None else round(p95_present_ms, 3),
                      "max_present_ms": None if max_present_ms is None else round(max_present_ms, 3),
                      "jsonl_path": str(case_path),
                  }
              )

          summary_count = sum(1 for event in suite_events if event.get("type") == "suite_case_summary")
          if summary_count != len(cases):
              failures.append(
                  f"suite JSONL case summary count mismatch: expected {len(cases)}, got {summary_count}"
              )

          go_no_go = len(failures) == 0
          decision = "go" if go_no_go else "no-go"
          generated_at = datetime.now(tz=timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          payload = {
              "schema_version": "1.0.0",
              "suite": "remote_typography_rescale",
              "decision": decision,
              "go_no_go": go_no_go,
              "generated_at_utc": generated_at,
              "run_id": report.get("run_id", ""),
              "seed": report.get("seed"),
              "thresholds": perf_thresholds,
              "case_metrics": case_metrics,
              "failures": failures,
              "repro_commands": report.get("repro_commands", {}),
              "artifacts": artifact_paths,
          }

          go_no_go_json.parent.mkdir(parents=True, exist_ok=True)
          go_no_go_json.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")

          lines = [
              "frankenterm typography/rescale release gate",
              f"generated_at_utc={generated_at}",
              f"run_id={payload['run_id']}",
              f"seed={payload['seed']}",
              f"decision={decision}",
              f"go_no_go={str(go_no_go).lower()}",
              f"p95_present_ms_max={perf_thresholds['p95_present_ms_max']}",
              f"max_present_ms_max={perf_thresholds['max_present_ms_max']}",
          ]
          for metric in case_metrics:
              case_name = metric["case"]
              lines.append(f"case.{case_name}.p95_present_ms={metric['p95_present_ms']}")
              lines.append(f"case.{case_name}.max_present_ms={metric['max_present_ms']}")
              lines.append(f"case.{case_name}.event_count={metric['event_count']}")
              lines.append(f"case.{case_name}.frame_count={metric['frame_count']}")

          if failures:
              lines.append("failures=" + " | ".join(failures))
          go_no_go_txt.write_text("\n".join(lines) + "\n", encoding="utf-8")

          artifact_map_entries = {
              "suite_jsonl": str(suite_jsonl),
              "suite_report": str(suite_report),
              "go_no_go_report_json": str(go_no_go_json),
              "go_no_go_report_txt": str(go_no_go_txt),
          }
          artifact_map_entries.update(artifact_paths)

          with artifact_map_txt.open("w", encoding="utf-8") as fh:
              fh.write("frankenterm typography/rescale artifact map\n")
              fh.write(f"generated_at_utc={generated_at}\n")
              for key, value in sorted(artifact_map_entries.items()):
                  fh.write(f"{key}={value}\n")

          artifact_map_payload = {
              "schema_version": "1.0.0",
              "generated_at_utc": generated_at,
              "artifacts": {},
          }
          for key, value in sorted(artifact_map_entries.items()):
              path = Path(value)
              artifact_map_payload["artifacts"][key] = {
                  "path": value,
                  "exists": path.exists(),
                  "size_bytes": path.stat().st_size if path.exists() and path.is_file() else None,
              }
          artifact_map_json.write_text(json.dumps(artifact_map_payload, indent=2) + "\n", encoding="utf-8")

          if not go_no_go:
              raise SystemExit("release gate decision=no-go")
          PY

          {
            echo "## Frankenterm Typography/Rescale Release Gate"
            echo ""
            echo '```'
            cat "${GO_NO_GO_TXT}"
            echo '```'
            echo ""
            echo "artifact_map_json=${ARTIFACT_MAP_JSON}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload golden-trace logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-trace-logs
          path: |
            /tmp/ftui_schedule_trace_e2e/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload typography/rescale release-gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frankenterm-typography-rescale-release-gates
          path: /tmp/frankenterm_release_gates/remote_typography_rescale/
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # doctor_frankentui Verification (unit + integration + e2e + coverage gate)
  # ==========================================================================
  doctor-frankentui-verification:
    name: doctor_frankentui Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCTOR_FTUI_ARTIFACT_ROOT: /tmp/doctor_frankentui_ci
      DOCTOR_FRANKENTUI_VHS_SMOKE_TIMEOUT_S: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies (jq, rg, ffmpeg, ttyd)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq ripgrep ffmpeg

          if command -v ttyd >/dev/null 2>&1; then
            ttyd --version || ttyd -v || true
          elif sudo apt-get install -y ttyd; then
            ttyd --version || ttyd -v || true
          else
            echo "ttyd not available via apt; downloading pinned binary" >&2
            TTYD_VERSION="1.7.7"
            curl -fsSL -o /tmp/ttyd.x86_64 "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
            sudo install -m 0755 /tmp/ttyd.x86_64 /usr/local/bin/ttyd
            ttyd --version || ttyd -v || true
          fi

      - name: Install VHS (pinned)
        run: |
          set -euo pipefail
          VHS_VERSION="0.10.0"
          curl -fsSL -o /tmp/vhs.tar.gz "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          # The 0.10.x tarballs contain a versioned directory rather than
          # extracting the binary at the archive root, so locate the binary
          # before installing instead of assuming `/tmp/vhs` exists.
          tar -xzf /tmp/vhs.tar.gz -C /tmp
          vhs_bin="$(find /tmp -maxdepth 3 -type f -name vhs -perm -u+x 2>/dev/null | head -n 1)"
          if [ -z "$vhs_bin" ]; then
            echo "vhs binary not found after extracting /tmp/vhs.tar.gz" >&2
            ls -R /tmp | head -50 >&2 || true
            exit 1
          fi
          sudo install -m 0755 "$vhs_bin" /usr/local/bin/vhs
          vhs --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doctor-frankentui-${{ hashFiles('**/Cargo.lock') }}

      - name: Run doctor_frankentui no-fake realism gate
        run: |
          set -euo pipefail
          mkdir -p "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs"
          python3 ./scripts/doctor_frankentui_no_fake_gate.py \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/no_fake_gate.log"

      - name: Run doctor_frankentui optimization-model gate (bd-3bxhj.8.12)
        run: |
          set -euo pipefail
          mkdir -p "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs"
          # Fail-closed VOI-allocator + BOCPD/CUSUM drift-model unit/property gate.
          # Must pass before the .8.13/.8.21 E2E adaptive-scheduling gauntlets.
          cargo test -p doctor_frankentui --lib optimization_model_tests -- --nocapture \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/optimization_model_gate.log"

      - name: Run doctor_frankentui unit + integration tests
        run: |
          set -euo pipefail
          mkdir -p "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs"
          cargo test -p doctor_frankentui --all-targets -- --nocapture \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/unit_integration.log"

      - name: Run doctor_frankentui happy-path E2E
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_happy_e2e.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/happy" \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/happy_e2e.log"

      - name: Run doctor_frankentui failure-path E2E
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_failure_e2e.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/failure" \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/failure_e2e.log"

      - name: Run doctor_frankentui gap-closure E2E
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_gap_closure_e2e.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/gap_closure" \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/gap_closure_e2e.log"

      - name: Run doctor_frankentui certification E2E
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_certification_e2e.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/certification" \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/certification_e2e.log"

      - name: Run doctor_frankentui proof-artifact E2E
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_proof_artifacts_e2e.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/proof_artifacts" \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/proof_artifacts_e2e.log"

      - name: Build doctor_frankentui replay/triage summary
        if: always()
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_replay_triage.py \
            --run-root "${DOCTOR_FTUI_ARTIFACT_ROOT}/failure" \
            --output-json "${DOCTOR_FTUI_ARTIFACT_ROOT}/failure/meta/replay_triage_report.json" \
            --max-signals 8 \
            --max-timeline 80 \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/replay_triage.log"

      - name: Run doctor_frankentui determinism soak
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_determinism_soak.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/determinism" 2 \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/determinism_soak.log"

      - name: Run doctor_frankentui coverage gate
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_coverage.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/coverage" \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/coverage_gate.log"
          cp crates/doctor_frankentui/coverage/thresholds.toml "${DOCTOR_FTUI_ARTIFACT_ROOT}/coverage/thresholds.toml"
          cp crates/doctor_frankentui/coverage/e2e_jsonl_schema.json "${DOCTOR_FTUI_ARTIFACT_ROOT}/coverage/e2e_jsonl_schema.json"

      - name: Run doctor_frankentui shadow comparison
        run: |
          set -euo pipefail
          ./scripts/doctor_frankentui_shadow_compare.sh "${DOCTOR_FTUI_ARTIFACT_ROOT}/shadow" happy \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/shadow_compare.log"

      - name: Write artifact map
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${DOCTOR_FTUI_ARTIFACT_ROOT}"
          artifact_map_txt="${DOCTOR_FTUI_ARTIFACT_ROOT}/artifact_map.txt"
          artifact_map_json="${DOCTOR_FTUI_ARTIFACT_ROOT}/artifact_map.json"
          {
            echo "doctor_frankentui artifact map"
            echo "generated_at_utc=$(date -u +%Y%m%dT%H%M%SZ)"
            echo "git_rev=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "artifact_root=${DOCTOR_FTUI_ARTIFACT_ROOT}"
            echo "unit_integration_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/unit_integration.log"
            echo "no_fake_gate_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/no_fake_gate.log"
            echo "happy_e2e_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/happy_e2e.log"
            echo "happy_summary=${DOCTOR_FTUI_ARTIFACT_ROOT}/happy/meta/summary.json"
            echo "happy_events_jsonl=${DOCTOR_FTUI_ARTIFACT_ROOT}/happy/meta/events.jsonl"
            echo "happy_events_validation_report=${DOCTOR_FTUI_ARTIFACT_ROOT}/happy/meta/events_validation_report.json"
            echo "happy_artifact_manifest=${DOCTOR_FTUI_ARTIFACT_ROOT}/happy/meta/artifact_manifest.json"
            echo "failure_e2e_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/failure_e2e.log"
            echo "failure_summary=${DOCTOR_FTUI_ARTIFACT_ROOT}/failure/meta/summary.json"
            echo "failure_events_jsonl=${DOCTOR_FTUI_ARTIFACT_ROOT}/failure/meta/events.jsonl"
            echo "failure_events_validation_report=${DOCTOR_FTUI_ARTIFACT_ROOT}/failure/meta/events_validation_report.json"
            echo "failure_case_results=${DOCTOR_FTUI_ARTIFACT_ROOT}/failure/meta/case_results.json"
            echo "gap_closure_e2e_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/gap_closure_e2e.log"
            echo "gap_closure_summary=${DOCTOR_FTUI_ARTIFACT_ROOT}/gap_closure/meta/summary.json"
            echo "gap_closure_events_jsonl=${DOCTOR_FTUI_ARTIFACT_ROOT}/gap_closure/meta/events.jsonl"
            echo "gap_closure_events_validation_report=${DOCTOR_FTUI_ARTIFACT_ROOT}/gap_closure/meta/events_validation_report.json"
            echo "gap_closure_ledger_jsonl=${DOCTOR_FTUI_ARTIFACT_ROOT}/gap_closure/meta/gap_closure_ledger.jsonl"
            echo "gap_closure_artifact_manifest=${DOCTOR_FTUI_ARTIFACT_ROOT}/gap_closure/meta/artifact_manifest.json"
            echo "certification_e2e_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/certification_e2e.log"
            echo "certification_summary=${DOCTOR_FTUI_ARTIFACT_ROOT}/certification/meta/summary.json"
            echo "certification_events_jsonl=${DOCTOR_FTUI_ARTIFACT_ROOT}/certification/meta/events.jsonl"
            echo "certification_events_validation_report=${DOCTOR_FTUI_ARTIFACT_ROOT}/certification/meta/events_validation_report.json"
            echo "certification_evidence_ledger_jsonl=${DOCTOR_FTUI_ARTIFACT_ROOT}/certification/meta/certification_evidence_ledger.jsonl"
            echo "certification_cargo_gate_results=${DOCTOR_FTUI_ARTIFACT_ROOT}/certification/meta/cargo_gate_results.json"
            echo "certification_artifact_manifest=${DOCTOR_FTUI_ARTIFACT_ROOT}/certification/meta/artifact_manifest.json"
            echo "certification_replay_dir=${DOCTOR_FTUI_ARTIFACT_ROOT}/certification/replay"
            echo "proof_artifacts_e2e_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/proof_artifacts_e2e.log"
            echo "proof_artifacts_summary=${DOCTOR_FTUI_ARTIFACT_ROOT}/proof_artifacts/meta/summary.json"
            echo "proof_artifacts_events_jsonl=${DOCTOR_FTUI_ARTIFACT_ROOT}/proof_artifacts/meta/events.jsonl"
            echo "proof_artifacts_events_validation_report=${DOCTOR_FTUI_ARTIFACT_ROOT}/proof_artifacts/meta/events_validation_report.json"
            echo "proof_artifacts_ledger_jsonl=${DOCTOR_FTUI_ARTIFACT_ROOT}/proof_artifacts/meta/proof_artifact_ledger.jsonl"
            echo "proof_artifacts_verifier_summary=${DOCTOR_FTUI_ARTIFACT_ROOT}/proof_artifacts/verifier/proof_verifier_summary.json"
            echo "proof_artifacts_artifact_manifest=${DOCTOR_FTUI_ARTIFACT_ROOT}/proof_artifacts/meta/artifact_manifest.json"
            echo "proof_artifacts_replay_dir=${DOCTOR_FTUI_ARTIFACT_ROOT}/proof_artifacts/replay"
            echo "replay_triage_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/replay_triage.log"
            echo "replay_triage_report_json=${DOCTOR_FTUI_ARTIFACT_ROOT}/failure/meta/replay_triage_report.json"
            echo "determinism_soak_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/determinism_soak.log"
            echo "determinism_run_index=${DOCTOR_FTUI_ARTIFACT_ROOT}/determinism/meta/run_index.tsv"
            echo "determinism_report_json=${DOCTOR_FTUI_ARTIFACT_ROOT}/determinism/meta/determinism_report.json"
            echo "determinism_report_txt=${DOCTOR_FTUI_ARTIFACT_ROOT}/determinism/meta/determinism_report.txt"
            echo "coverage_gate_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/coverage_gate.log"
            echo "coverage_thresholds_toml=${DOCTOR_FTUI_ARTIFACT_ROOT}/coverage/thresholds.toml"
            echo "telemetry_schema_json=${DOCTOR_FTUI_ARTIFACT_ROOT}/coverage/e2e_jsonl_schema.json"
            echo "coverage_report_json=${DOCTOR_FTUI_ARTIFACT_ROOT}/coverage/coverage_gate_report.json"
            echo "coverage_report_txt=${DOCTOR_FTUI_ARTIFACT_ROOT}/coverage/coverage_gate_report.txt"
            echo "shadow_compare_log=${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/shadow_compare.log"
            echo "shadow_report_json=${DOCTOR_FTUI_ARTIFACT_ROOT}/shadow/artifacts/shadow_report.json"
            echo "shadow_summary_json=${DOCTOR_FTUI_ARTIFACT_ROOT}/shadow/meta/summary.json"
            echo "shadow_summary_txt=${DOCTOR_FTUI_ARTIFACT_ROOT}/shadow/meta/summary.txt"
            echo "shadow_artifact_manifest=${DOCTOR_FTUI_ARTIFACT_ROOT}/shadow/meta/artifact_manifest.json"
            echo "shadow_replay_sh=${DOCTOR_FTUI_ARTIFACT_ROOT}/shadow/artifacts/replay.sh"
            echo "artifact_map_json=${artifact_map_json}"
          } > "${artifact_map_txt}"

          python3 - "${artifact_map_txt}" "${artifact_map_json}" <<'PY'
          import json
          import sys
          from pathlib import Path

          txt_path = Path(sys.argv[1])
          json_path = Path(sys.argv[2])

          raw_lines = txt_path.read_text(encoding="utf-8").splitlines()
          raw_kv: dict[str, str] = {}
          for line in raw_lines:
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              raw_kv[key.strip()] = value.strip()

          def looks_like_path(value: str) -> bool:
              if value.startswith(("/", "./")):
                  return True
              return any(value.endswith(suffix) for suffix in (".log", ".txt", ".json", ".tsv", ".toml"))

          artifacts: dict[str, str] = {}
          metadata: dict[str, str] = {}
          for key, value in sorted(raw_kv.items()):
              if key in {"git_rev", "generated_at_utc"}:
                  metadata[key] = value
              elif looks_like_path(value):
                  artifacts[key] = value
              else:
                  metadata[key] = value

          exists: dict[str, bool] = {}
          sizes_bytes: dict[str, int | None] = {}
          for key, value in artifacts.items():
              path = Path(value)
              exists[key] = path.exists()
              if path.exists() and path.is_file():
                  sizes_bytes[key] = int(path.stat().st_size)
              else:
                  sizes_bytes[key] = None

          payload = {
              "schema_version": "1.0.0",
              "metadata": metadata,
              "artifacts": artifacts,
              "exists": exists,
              "sizes_bytes": sizes_bytes,
          }
          json_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

          {
            echo "## doctor_frankentui artifact map"
            echo ""
            echo '```'
            cat "${artifact_map_txt}"
            echo '```'
            echo ""
            echo "artifact_map_json=${artifact_map_json}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload doctor_frankentui verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doctor-frankentui-verification
          path: /tmp/doctor_frankentui_ci/
          retention-days: 14
          if-no-files-found: error

  # ==========================================================================
  # Fuzz Build Check
  # ==========================================================================
  fuzz:
    name: Fuzz Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}

      - name: Build fuzz targets
        run: cargo fuzz build

      - name: Quick fuzz run (20s per target)
        run: |
          cargo fuzz run fuzz_input_parser -- -max_len=4096 -max_total_time=20
          cargo fuzz run fuzz_input_parser_structured -- -max_len=4096 -max_total_time=20
          cargo fuzz run fuzz_input_parser_long_seq -- -max_total_time=20
          cargo fuzz run fuzz_text_cluster_map -- -max_len=512 -max_total_time=20
          cargo fuzz run fuzz_text_shaped_layout -- -max_len=512 -max_total_time=20
          cargo fuzz run fuzz_text_wrap -- -max_len=512 -max_total_time=20
          cargo fuzz run fuzz_text_width -- -max_len=512 -max_total_time=20
          cargo fuzz run fuzz_text_hyphenation -- -max_len=512 -max_total_time=20
          cargo fuzz run fuzz_layout_constraints -- -max_len=256 -max_total_time=20
          cargo fuzz run fuzz_widget_render -- -max_len=512 -max_total_time=20

      - name: Fuzz campaign with minimized repro artifacts (bd-2vr05.10.4)
        run: |
          set -euo pipefail
          # Release-blocking: the campaign harness fuzzes every target, validates
          # JSONL telemetry, and writes minimized crash repros under fuzz/artifacts.
          # Short per-target budget keeps CI fast; nightly runs raise the duration.
          FUZZ_DURATION_SECS="${FUZZ_DURATION_SECS:-20}" ./scripts/fuzz_campaign_e2e.sh

      - name: Upload fuzz campaign artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-campaign-artifacts
          path: |
            /tmp/fuzz_campaign_e2e_*/
            fuzz/artifacts/
          if-no-files-found: ignore

  # ==========================================================================
  # FrankenTerm Conformance / Differential / WebSocket Release Gates
  # (bd-2vr05.10.5 — wire conformance/differential/fuzz into release-blocking
  # gates; fuzz is gated by the `fuzz` job above)
  # ==========================================================================
  frankenterm-conformance-gates:
    name: FrankenTerm Conformance/Differential/WS Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-frankenterm-gates-${{ hashFiles('**/Cargo.lock') }}

      - name: Conformance — VT support-matrix gate (bd-2vr05.10.1)
        run: |
          set -euo pipefail
          # Tracks declared support-matrix claims; emits per-capability JSONL +
          # a summary JSON. Fails on any unmet declared capability.
          ./scripts/vt_support_matrix_e2e.sh /tmp/frankenterm_gates/vt

      - name: Differential — xterm.js shared-fixture gate (bd-2vr05.10.2)
        run: |
          set -euo pipefail
          # Runs the shared VT fixture corpus through FrankenTerm's virtual
          # terminal and classifies mismatches against the xterm.js-compatible
          # baseline (normalised expected differences). Fails on unclassified drift.
          ./tests/e2e/scripts/test_xterm_shared_fixture_differential.sh

      - name: Conformance — WebSocket protocol compliance gate (bd-2vr05.10.3)
        run: |
          set -euo pipefail
          # Drives the in-tree frankenterm_ws_bridge through the protocol compliance
          # client, emitting per-frame JSONL + a compliance report.
          ./tests/e2e/scripts/test_ws_protocol_compliance.sh

      - name: Adversarial security/reliability gate (bd-2vr05.11.6)
        run: |
          set -euo pipefail
          # Single release-blocking gate over every in-tree security/reliability
          # subsystem under hostile/degraded conditions: flow-control drop policy
          # (interactive never dropped), bounded queue/memory caps + overload
          # termination, OSC-8 link escape-breakout sanitization, and OSC-52
          # clipboard bounded-payload policy. Folds each arm's incident-grade
          # evidence into one manifest under /tmp/frankenterm_gates/ and fails on
          # missing coverage, any failed cell, malformed JSON, or absent
          # failure-injection coverage.
          ./scripts/frankenterm_js_security_reliability_compat.sh

      - name: Upload conformance/differential/ws gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frankenterm-conformance-gate-artifacts
          path: |
            /tmp/frankenterm_gates/
            /tmp/ftui_e2e_logs/
          if-no-files-found: ignore

      - name: Triage instructions (on failure)
        if: failure()
        run: |
          echo "::group::FrankenTerm gate triage"
          echo "A release-blocking conformance gate failed. See:"
          echo "  docs/testing/frankenterm-conformance-gates.md"
          echo "Per-gate JSONL + summaries are uploaded as 'frankenterm-conformance-gate-artifacts'."
          echo "  - Conformance:   /tmp/frankenterm_gates/vt/meta/vt_support_matrix_{results.jsonl,summary.json}"
          echo "  - Differential:  /tmp/ftui_e2e_logs/xterm_shared_fixture_differential/*.{jsonl,json}"
          echo "  - WebSocket:     /tmp/ftui_e2e_logs/ws_protocol_compliance/*.{jsonl,json}"
          echo "  - Security/rel:  /tmp/frankenterm_gates/security_reliability/security_reliability_compat_{manifest.jsonl,summary.json}"
          echo "Grep failed cells with: jq 'select(.passed==false or .status==\"fail\")' <jsonl>"
          echo "::endgroup::"

  # ==========================================================================
  # MSRV Check (Minimum Supported Rust Version)
  # ==========================================================================
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Using nightly as MSRV since project requires edition 2024
          toolchain: nightly

      - name: Check MSRV
        run: cargo check --workspace

  # ==========================================================================
  # WASM Build Check (host-agnostic surfaces)
  # ==========================================================================
  wasm:
    name: WASM Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Check host-agnostic crates for wasm32-unknown-unknown
        run: |
          set -euo pipefail
          cargo check --target wasm32-unknown-unknown -p ftui-core
          cargo check --target wasm32-unknown-unknown -p ftui-render
          cargo check --target wasm32-unknown-unknown -p ftui-style
          cargo check --target wasm32-unknown-unknown -p ftui-layout
          cargo check --target wasm32-unknown-unknown -p ftui-text
          cargo check --target wasm32-unknown-unknown -p ftui-i18n
          cargo check --target wasm32-unknown-unknown -p frankenterm-core

  # ==========================================================================
  # Pane Perf — Symbolized Replay Artifacts (bd-1pvzq.1)
  # ==========================================================================
  # Runs the pane profiling harness + adapter benches in fast --test mode and
  # publishes a checksummed "symbolized pane replay artifact" bundle that ties
  # the deterministic replay manifest to per-binary symbolization provenance.
  # The strict validator fails the job if symbols, manifests, path conventions,
  # or checksums silently degrade (bd-1pvzq.1 AC2). Later perf gates (bd-1pvzq.2
  # / .3 / .5) consume the uploaded index.
  pane-perf-artifacts:
    name: Pane Perf Replay Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pane-perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify symbolization toolchain
        run: |
          set -euo pipefail
          for tool in readelf addr2line file sha256sum python3; do
            command -v "$tool" >/dev/null 2>&1 || { echo "missing required tool: $tool" >&2; exit 1; }
          done

      - name: Emit symbolized pane replay artifacts
        run: ./scripts/pane_profile.sh --test --out-dir target/pane-profiling/ci

      - name: Validate replay artifact contract (strict)
        run: |
          python3 scripts/pane_replay_artifacts.py validate \
            --index target/pane-profiling/ci/replay_artifact_index.json \
            --require-symbolization \
            --json

      # bd-1pvzq.3: the perf gate must carry behavior-preservation evidence, not
      # just timing. Run the cross-strategy differential proof, then certify the
      # run against the golden replay-oracle. Reaching the certify step means the
      # matrix passed, so the differential half is recorded as passed; a golden
      # drift (semantic regression) fails the gate with an actionable report.
      - name: Differential determinism proof (baseline vs optimized strategies)
        run: cargo test -p ftui-layout --test pane_determinism_matrix -- --nocapture

      - name: Certify against golden replay-oracle (semantic + differential)
        run: |
          python3 scripts/pane_replay_artifacts.py certify \
            --index target/pane-profiling/ci/replay_artifact_index.json \
            --golden scripts/pane_replay_golden.json \
            --differential-matrix-passed true \
            --require-match \
            --json

      # bd-1pvzq.5: prove the user-visible optimized workflow stays safe under
      # sustained interaction and rolls back to the conservative path on a
      # monitor violation, with operator-grade JSONL + a self-contained bundle.
      - name: Pane soak + rollback E2E
        run: ./scripts/pane_soak_rollback.sh --out-dir target/pane-soak/ci

      # bd-1w0w4.7: tie the six release-evidence dimensions (unit/e2e/parity/
      # perf/a11y/logging) into one checksummed, schema-versioned bundle. The
      # static artifacts (compliance/traceability/parity contract/jsonl schema/
      # golden oracle) are checksummed from the tree; the perf runtime artifacts
      # (replay index + differential certification) come from this run. The
      # selftest guards the bundler's own contract.
      - name: Pane release-evidence bundle (collect + validate)
        run: |
          python3 scripts/pane_release_evidence.py selftest
          mkdir -p target/pane-release
          python3 scripts/pane_release_evidence.py collect \
            --out target/pane-release/pane_release_evidence.json \
            --results-dir target/pane-profiling/ci \
            --strict --json
          python3 scripts/pane_release_evidence.py validate \
            --bundle target/pane-release/pane_release_evidence.json \
            --json

      # bd-1w0w4.5: render the objective go/no-go verdict from the evidence
      # bundle + the behavioral certification. Strict mode requires the perf
      # runtime artifacts present and the differential certification 'certified';
      # a NO-GO fails the job. Suite-level greenness is enforced by each suite's
      # own job and is recorded 'declared' here unless a --test-summary is given.
      - name: Pane release gate (strict go/no-go)
        run: |
          python3 scripts/pane_release_gate.py selftest
          python3 scripts/pane_release_gate.py evaluate \
            --bundle target/pane-release/pane_release_evidence.json \
            --certification target/pane-profiling/ci/differential_certification.json \
            --mode strict \
            --out target/pane-release/pane_release_gate.json \
            --json

      - name: Upload pane release-evidence + gate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pane-release-evidence
          path: target/pane-release
          retention-days: 30

      - name: Upload pane soak + rollback bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pane-soak-rollback
          path: target/pane-soak/ci
          retention-days: 30

      - name: Upload pane replay artifact bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pane-replay-artifacts
          path: target/pane-profiling/ci
          retention-days: 30
