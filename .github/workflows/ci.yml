      - name: Run doctor_frankentui formal-assurance gate (bd-3bxhj.10.28)
        run: |
          set -euo pipefail
          mkdir -p "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs"
          # Fail-closed E2E formal-assurance gauntlet across four areas: optional
          # stopping (e-process holds on a null stream, rejects a degradation
          # stream), coverage (conformal holds / breakdown -> fallback / insufficient
          # calibration -> assumption violation + fallback), drift (steady -> normal,
          # degrading -> hazard+BOCPD rollback), and explainability (galaxy card
          # reconstructs the decision deterministically). Every scenario must reach
          # its expected safe path, the calibration-breakdown + assumption-violation
          # red paths must trigger a conservative fallback, every line carries
          # guarantee assumptions / bound terms / a decision trace, and the
          # float-free ledger replays byte-identically.
          cargo test -p doctor_frankentui --lib formal_assurance_gauntlet -- --nocapture \
            2>&1 | tee "${DOCTOR_FTUI_ARTIFACT_ROOT}/logs/formal_assurance_gauntlet_gate.log"

